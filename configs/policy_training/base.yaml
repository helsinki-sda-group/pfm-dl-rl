train: True
test: True
test_baseline: True
test_random: True

env:
  sumo_steps: 3000
  basic_episodes: 126
  episodes_scaling_coeff: 0  # episode scaling coefficient in [0,1]. 0=no scaling, 1=full scaling for delta
  delta: 1  # step of policy applying (delta=1 means one simulation iteration)
  num_envs: 1
  seed: 1
  sumocfg: nets/ridepooling/older_net.sumocfg
  use_gui: False
  verbose: False
  obs_dim: 6

baseline:
  num_periods: 5
  num_actions: 1

dqn:
  policy: MlpPolicy
  batch_size: 128
  learning_rate: 0.0001
  learning_starts: 20000
  buffer_size: 200000
  train_freq: 1  # we do not scale it
  gradient_steps: 1  # we do not scale it
  target_update_interval: 20000  # divided by delta 
  exploration_fraction: 0.3
  exploration_initial_eps: 1
  exploration_final_eps: 0.05
  verbose: 0
eval:
  eval_freq: 10000

tests:
  num_tests: 10